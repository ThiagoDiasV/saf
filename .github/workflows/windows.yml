name: windows

# SAF on Windows: the smoke test in Chrome against SAF running on Windows, then the desktop app
# itself on a fresh machine (its window uses WebView2, the same Chromium engine).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Smoke test on Windows (Chrome)
        env:
          CHROME: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: node test/browser/smoke.mjs
      - name: Build SAF.exe
        if: success() || failure()
        shell: bash
        run: build/windows.sh dist/SAF/SAF.exe
      - name: SAF.exe on a fresh PC
        if: success() || failure()
        run: |
          $key = (& .\dist\SAF\SAF.exe keygen | Out-String).Trim()
          if ($key.Length -ne 44) { throw "SAF.exe keygen printed '$key'" }

          $saf = Start-Process -FilePath .\dist\SAF\SAF.exe -PassThru
          try {
          $peers = @()
          foreach ($i in 1..90) { # WebView2's first start on a fresh machine can be slow
            Start-Sleep -Seconds 1
            if ($saf.HasExited) { throw "SAF.exe exited with code $($saf.ExitCode)" }
            $port = (Get-NetTCPConnection -OwningProcess $saf.Id -State Listen -ErrorAction SilentlyContinue).LocalPort
            if (-not $port) { continue }
            $peers = @(Get-NetTCPConnection -RemotePort $port -State Established -ErrorAction SilentlyContinue |
              ForEach-Object { (Get-Process -Id $_.OwningProcess).ProcessName })
            if ($peers -contains 'msedgewebview2') { break }
          }
          "SAF listens on 127.0.0.1:$port; connected: $($peers -join ', ')"
          if (-not ($peers -contains 'msedgewebview2')) { throw "the SAF window did not reach SAF" }
          if (-not (Test-Path .\dist\SAF\chave.key)) { throw "no chave.key next to SAF.exe" }
          if (-not (Test-Path .\dist\SAF\dados\saf.db)) { throw "no dados\saf.db next to SAF.exe" }

          $second = Start-Process -FilePath .\dist\SAF\SAF.exe -PassThru
          if (-not $second.WaitForExit(20000)) { throw "a second SAF.exe kept running" }
          if ($saf.HasExited) { throw "the first SAF closed when the second started" }
          "a second double-click hands over to the open window"
          } finally {
            # Always: when the window doesn't show, the screen shows why (SAF's error box).
            Start-Sleep -Seconds 2
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              New-Item -ItemType Directory -Force shots | Out-Null
              $bitmap.Save("$PWD\shots\saf-window.png")
            } catch { "No screenshot: $_" }
            Stop-Process -Id $saf.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-screenshot
          path: shots
          if-no-files-found: ignore
