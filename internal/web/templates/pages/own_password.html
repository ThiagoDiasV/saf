{{define "content"}}
<div class="page-head"><div><h1>Alterar minha senha</h1><p>Outros aparelhos onde você entrou vão pedir a senha de novo.</p></div></div>
<form class="card" method="post" action="/minha-senha" novalidate>
  <div class="card-pad stack-lg">
    <label class="field"><span>Senha atual</span>
      <input name="current" type="password" autocomplete="current-password" autofocus{{if .Errors.current}} aria-invalid="true"{{end}}>
      {{- with .Errors.current}}<span class="field-error">{{icon "alert"}}{{.}}</span>{{end}}
    </label>
    <label class="field"><span>Nova senha</span>
      <input name="password" type="password" autocomplete="new-password"{{if .Errors.password}} aria-invalid="true"{{end}}>
      <span class="hint">Mínimo de 12 caracteres.</span>
      {{- with .Errors.password}}<span class="field-error">{{icon "alert"}}{{.}}</span>{{end}}
    </label>
    <label class="field"><span>Repita a nova senha</span>
      <input name="confirm" type="password" autocomplete="new-password"{{if .Errors.confirm}} aria-invalid="true"{{end}}>
      {{- with .Errors.confirm}}<span class="field-error">{{icon "alert"}}{{.}}</span>{{end}}
    </label>
  </div>
  <div class="form-foot">
    <a class="btn" href="/estoque">Cancelar</a>
    <button class="btn btn-primary" type="submit">{{icon "check"}}Salvar senha</button>
  </div>
</form>
{{end}}
