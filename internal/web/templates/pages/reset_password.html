{{define "content"}}
<div class="page-head"><div><h1>Redefinir senha</h1><p>{{.Page.Target.Name}} · {{.Page.Target.Login}}</p></div></div>
<form class="card" method="post" action="/usuarios/{{.Page.Target.ID}}/senha" novalidate>
  <div class="card-pad stack-lg">
    <label class="field"><span>Nova senha</span>
      <input name="password" type="password" autocomplete="new-password" autofocus{{if .Errors.password}} aria-invalid="true"{{end}}>
      <span class="hint">Mínimo de 12 caracteres. Entregue pessoalmente.</span>
      {{- with .Errors.password}}<span class="field-error">{{icon "alert"}}{{.}}</span>{{end}}
    </label>
    <p class="hint">As sessões abertas dessa pessoa são encerradas, e um bloqueio por tentativas é desfeito.</p>
  </div>
  <div class="form-foot">
    <a class="btn" href="/usuarios">Cancelar</a>
    <button class="btn btn-primary" type="submit">{{icon "check"}}Salvar senha</button>
  </div>
</form>
{{end}}
