# Litestream inside the SAF container (docs/PLAN.md §6); environment variables are expanded.
# It starts SAF, streams every database change to SAF_REPLICA_URL within seconds, and keeps 30
# days of history: a first name deleted after six months leaves the backups within 30 days.
#
#   production: SAF_REPLICA_URL=gs://<bucket>/db
#   local:      SAF_REPLICA_URL=file:///data/replica
exec: /saf serve

snapshot:
  interval: 24h
  retention: 720h

dbs:
  - path: ${SAF_DATA_DIR}/saf.db
    replica:
      url: ${SAF_REPLICA_URL}
